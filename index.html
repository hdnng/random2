<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>HAPPY NEW YEAR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/firework.css">
    

</head>

<body>
    <div class="scene">
        <header class="header">
            <div class="header-top">
                <div class="logo-left">
                    <img src="/img/kangjinLogo.png" alt="kangjinLogo">
                </div>

                <div class="logo-right">
                    <img src="/img/madeuLogo.png" alt="madeuLogo">

                </div>
            </div>

            <img class="header-title" src="/img/happynewyear.png" alt="happynewyear">

        </header>

        <main class="spin-area">
            <div class="energy-wrapper">
                <div class="spin-blur"></div>
                <div id="slot-machine" class="slot-machine">
                    <div class="marker"></div>
                    <div class="items">
                        <div class="item"><img src="/img/gift/QUÀ 1.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 2.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 3.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 4.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 5.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 6.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 7.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 8.png"></div>
                        <div class="item"><img src="/img/gift/QUÀ 9.png"></div>
                    </div>
                    
                </div>
                <div class="energy-burst"></div>
                <img class="hud-ring" src="/img/hudRing.png" alt="">
                <div class="energy-ring"></div>
                <div class="energy-sphere"></div>
                <button class="spin-btn" id="spinBtn">
                    <img src="/img/starButton.png" alt="Star">
                </button>
            </div>
        </main>

        <footer class="footer">

            <canvas id="footer-firework"></canvas>


            <div class="footer-text">
                <img src="/img/bottomTitle.png" alt="titleBottom">
            </div>
        </footer>
    </div>
    <div id="overlay" class="overlay hidden">
        <div class="result">
            <img id="result-img" src="" alt="Result">
        </div>
    </div>
    <script src="/js/slotMachine.js"></script>
    <script src="/js/footerHeartFirework.js"></script>
</body>

</html>
